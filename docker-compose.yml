version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agrimatco_postgres
    environment:
      POSTGRES_USER: agrimatco
      POSTGRES_PASSWORD: agrimatco_password
      POSTGRES_DB: agrimatco_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agrimatco_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimatco"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrimatco_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agrimatco_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agrimatco_backend
    environment:
      DATABASE_URL: postgresql://agrimatco:agrimatco_password@postgres:5432/agrimatco_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agrimatco_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: agrimatco_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - agrimatco_network

  nginx:
    image: nginx:alpine
    container_name: agrimatco_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agrimatco_network

volumes:
  postgres_data:
  redis_data:

networks:
  agrimatco_network:
    driver: bridge
